// ===== Stats Overview =====
function renderStats() {
  const container = document.getElementById('statsOverview');

  // Summary counts
  const totalSafe = allIngredients.filter(i => i.status === 'safe').length;
  const totalPending = allIngredients.filter(i => i.status === 'pending').length;
  const totalAllergy = allIngredients.filter(i => i.status === 'allergy').length;
  const totalMeals = allMeals.length;

  // Category breakdown
  const catBreakdown = {};
  allIngredients.forEach(i => {
    if (!catBreakdown[i.category]) catBreakdown[i.category] = { safe: 0, pending: 0, allergy: 0 };
    catBreakdown[i.category][i.status]++;
  });

  // Recent meals (last 7 days)
  const sevenDaysAgo = getDatePlusDays(todayStr, -7);
  const recentMeals = allMeals.filter(m => m.date >= sevenDaysAgo);
  const recentDays = new Set(recentMeals.map(m => m.date)).size;

  // Average intake
  let totalGrains = 0, totalVeg = 0, totalFruit = 0, totalMeat = 0, totalEgg = 0, totalOil = 0;
  let mealCount = 0;
  recentMeals.forEach(meal => {
    mealCount++;
    (meal.ingredients || []).forEach(ing => {
      const ingredient = allIngredients.find(i => i.name === ing.name);
      const cat = ingredient ? ingredient.category : '其他';
      if (cat === '谷类') totalGrains += ing.weight || 0;
      if (cat === '蔬菜') totalVeg += ing.weight || 0;
      if (cat === '水果') totalFruit += ing.weight || 0;
      if (cat === '肉类' || cat === '水产') totalMeat += ing.weight || 0;
      if (cat === '蛋类') totalEgg += ing.weight || 0;
      if (cat === '油脂') totalOil += ing.weight || 0;
    });
  });

  const avgDays = recentDays || 1;

  let html = `
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:20px;">
      <div style="background:white;border-radius:var(--radius);padding:20px;text-align:center;border:2px solid var(--gray-300);">
        <div style="font-size:32px;">✅</div>
        <div style="font-size:28px;font-weight:700;color:var(--success);">${totalSafe}</div>
        <div style="font-size:13px;color:var(--gray-500);">已排敏食材</div>
      </div>
      <div style="background:white;border-radius:var(--radius);padding:20px;text-align:center;border:2px solid var(--gray-300);">
        <div style="font-size:32px;">⏳</div>
        <div style="font-size:28px;font-weight:700;color:var(--warning);">${totalPending}</div>
        <div style="font-size:13px;color:var(--gray-500);">待添加食材</div>
      </div>
      <div style="background:white;border-radius:var(--radius);padding:20px;text-align:center;border:2px solid var(--gray-300);">
        <div style="font-size:32px;">⚠️</div>
        <div style="font-size:28px;font-weight:700;color:var(--danger);">${totalAllergy}</div>
        <div style="font-size:13px;color:var(--gray-500);">过敏食材</div>
      </div>
      <div style="background:white;border-radius:var(--radius);padding:20px;text-align:center;border:2px solid var(--gray-300);">
        <div style="font-size:32px;">🍽️</div>
        <div style="font-size:28px;font-weight:700;color:var(--primary);">${totalMeals}</div>
        <div style="font-size:13px;color:var(--gray-500);">辅食总顿数</div>
      </div>
    </div>

    <div style="background:white;border-radius:var(--radius);padding:20px;border:2px solid var(--gray-300);margin-bottom:16px;">
      <h3 style="font-size:15px;margin-bottom:12px;">最近7天（${sevenDaysAgo} ~ ${todayStr}）</h3>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px;">
        <div style="text-align:center;">
          <div style="font-size:24px;font-weight:700;">${recentDays}</div>
          <div style="font-size:12px;color:var(--gray-500);">有辅食的天数</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:24px;font-weight:700;">${recentMeals.length}</div>
          <div style="font-size:12px;color:var(--gray-500);">总顿数</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:24px;font-weight:700;">${(totalGrains / avgDays).toFixed(1)}g</div>
          <div style="font-size:12px;color:var(--gray-500);">日均谷类</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:24px;font-weight:700;">${(totalVeg / avgDays).toFixed(1)}g</div>
          <div style="font-size:12px;color:var(--gray-500);">日均蔬菜</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:24px;font-weight:700;">${(totalMeat / avgDays).toFixed(1)}g</div>
          <div style="font-size:12px;color:var(--gray-500);">日均肉禽</div>
        </div>
      </div>
    </div>
  `;

  // Ingredient appearance ranking (count across all meals)
  const ingredientCounts = {};
  allMeals.forEach(meal => {
    const seen = new Set();
    (meal.ingredients || []).forEach(ing => {
      if (!seen.has(ing.name)) {
        seen.add(ing.name);
        if (!ingredientCounts[ing.name]) {
          const ingredient = allIngredients.find(i => i.name === ing.name);
          ingredientCounts[ing.name] = {
            count: 0,
            category: ingredient ? ingredient.category : '其他',
            status: ingredient ? ingredient.status : 'pending'
          };
        }
        ingredientCounts[ing.name].count++;
      }
    });
  });

  const rankSort = window._ingredientRankSort || 'desc';
  const rankList = Object.entries(ingredientCounts).sort((a, b) => {
    return rankSort === 'desc' ? b[1].count - a[1].count : a[1].count - b[1].count;
  });

  // Two-column layout: category stats + ingredient ranking
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
    <!-- Left: Category breakdown -->
    <div style="background:white;border-radius:var(--radius);padding:20px;border:2px solid var(--gray-300);">
      <h3 style="font-size:15px;margin-bottom:12px;">食材分类统计</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <tr style="border-bottom:2px solid var(--gray-200);">
          <th style="text-align:left;padding:8px;">分类</th>
          <th style="text-align:center;padding:8px;color:var(--success);">已排敏</th>
          <th style="text-align:center;padding:8px;color:var(--warning);">待添加</th>
          <th style="text-align:center;padding:8px;color:var(--danger);">过敏</th>
          <th style="text-align:center;padding:8px;">总计</th>
        </tr>`;

  Object.entries(INGREDIENT_CATEGORIES).forEach(([cat, info]) => {
    const data = catBreakdown[cat] || { safe: 0, pending: 0, allergy: 0 };
    const total = data.safe + data.pending + data.allergy;
    if (total === 0) return;
    html += `<tr style="border-bottom:1px solid var(--gray-100);">
      <td style="padding:8px;">${info.emoji} ${cat}</td>
      <td style="text-align:center;padding:8px;">${data.safe || '-'}</td>
      <td style="text-align:center;padding:8px;">${data.pending || '-'}</td>
      <td style="text-align:center;padding:8px;">${data.allergy || '-'}</td>
      <td style="text-align:center;padding:8px;font-weight:600;">${total}</td>
    </tr>`;
  });

  html += `</table></div>

    <!-- Right: Ingredient appearance ranking -->
    <div style="background:white;border-radius:var(--radius);padding:20px;border:2px solid var(--gray-300);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="font-size:15px;">食材添加排名</h3>
        <button class="btn btn-sm" style="padding:4px 10px;font-size:12px;" onclick="toggleIngredientRankSort()">
          ${rankSort === 'desc' ? '⬇️ 次数多到少' : '⬆️ 次数少到多'}
        </button>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
        <tr style="border-bottom:2px solid var(--gray-200);">
          <th style="text-align:left;padding:8px;">食材</th>
          <th style="text-align:center;padding:8px;">次数</th>
        </tr>
        </thead>
      </table>
      <div style="max-height:290px;overflow-y:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <tbody>`;

  if (rankList.length === 0) {
    html += `<tr><td colspan="2" style="padding:16px;text-align:center;color:var(--gray-400);">暂无数据</td></tr>`;
  } else {
    rankList.forEach(([name, data]) => {
      const catInfo = INGREDIENT_CATEGORIES[data.category] || { emoji: '📦' };
      const statusColor = data.status === 'safe' ? 'var(--success)' : (data.status === 'allergy' ? 'var(--danger)' : 'var(--warning)');
      html += `<tr style="border-bottom:1px solid var(--gray-100);">
        <td style="padding:8px;">${catInfo.emoji} ${escapeHtml(name)}</td>
        <td style="text-align:center;padding:8px;font-weight:600;color:${statusColor};">${data.count}</td>
      </tr>`;
    });
  }

  html += `</tbody></table></div></div></div>`;

  container.innerHTML = html;
}

// ===== Utilities =====
function onRecipeCatFilterChange(value) {
  renderRecipes();
}

// Toggle ingredient ranking sort order
function toggleIngredientRankSort() {
  window._ingredientRankSort = (window._ingredientRankSort || 'desc') === 'desc' ? 'asc' : 'desc';
  renderStats();
}

function onRecipeCategoryChange() {
  const sel = document.getElementById('recipeCategory');
  const customDiv = document.getElementById('customCatInput');
  if (sel && customDiv) {
    customDiv.style.display = sel.value === '__custom__' ? 'block' : 'none';
  }
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
  window._selectedMealIngredients = {};
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getDatePlusDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return formatDate(d);
}

// ===== Export Calendar as Image =====
async function exportCalendarImage() {
  const grid = document.getElementById('calendarGrid');
  if (!grid || typeof html2canvas !== 'function') {
    alert('导出功能加载中，请稍后再试');
    return;
  }

  // Show loading hint
  const btn = document.querySelector('.calendar-export-btn');
  const origText = btn.textContent;
  btn.textContent = '生成中...';
  btn.disabled = true;

  try {
    // Clone grid to avoid messing with live DOM
    const canvas = await html2canvas(grid, {
      backgroundColor: '#FFFFFF',
      scale: 2,
      useCORS: true,
      logging: false,
    });

    // Convert to image and download
    const link = document.createElement('a');
    const monthStr = document.getElementById('calendarMonth').textContent.replace(/\s/g, '');
    link.download = `辣堡辅食日历_${monthStr}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) {
    console.error('Export failed:', err);
    alert('导出失败，请重试');
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

// ===== Share Menu Card =====
async function shareMenuCard(dateStr) {
  const dayMeals = allMeals.filter(m => m.date === dateStr).sort((a, b) => a.mealNumber - b.mealNumber);
  if (dayMeals.length === 0) {
    alert('当天还没有辅食记录，先添加再分享吧～');
    return;
  }

  const btn = document.getElementById('shareCardBtn');
  if (btn) { btn.textContent = '生成中...'; btn.disabled = true; }

  // ---- build date label ----
  const d = new Date(dateStr);
  const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
  const dateLabel = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${weekDays[d.getDay()]}`;

  // ---- compute baby age ----
  const birthDate = babyInfo && babyInfo.birthDate ? new Date(babyInfo.birthDate) : null;
  let ageLabel = '';
  if (birthDate) {
    const diffMs = d - birthDate;
    const diffDays = Math.floor(diffMs / 86400000);
    const months = Math.floor(diffDays / 30.44);
    const days = Math.floor(diffDays - months * 30.44);
    ageLabel = `宝宝 ${months} 个月 ${days} 天`;
  }

  // ---- meal slot icons ----
  const slotIcons = ['🌅', '☀️', '🌤️', '🌙'];
  const slotNames = ['第1顿', '第2顿', '第3顿', '第4顿'];

  // ---- build card HTML ----
  const cardId = '_shareCardCanvas';
  let old = document.getElementById(cardId);
  if (old) old.remove();

  const wrap = document.createElement('div');
  wrap.id = cardId;
  wrap.style.cssText = [
    'position:fixed',
    'left:-9999px',
    'top:0',
    'width:360px',
    'background:#FFFDF7',
    'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
    'border-radius:20px',
    'overflow:hidden',
    'box-shadow:0 8px 32px rgba(0,0,0,0.15)',
  ].join(';');

  // --- header ---
  let mealsHtml = '';
  for (let idx = 0; idx < dayMeals.length; idx++) {
    const meal = dayMeals[idx];
    const slotIdx = (meal.mealNumber || idx + 1) - 1;
    const icon = slotIcons[slotIdx] || '🍽️';
    const slotName = slotNames[slotIdx] || `第${meal.mealNumber}顿`;

    const ingLines = (meal.ingredients || []).map(i => {
      return `<span style="display:inline-block;background:#FFF0F2;border:1.5px solid #F7B3BE;border-radius:20px;padding:3px 10px;margin:2px 3px 2px 0;font-size:13px;color:#C4102E;font-weight:600;">${i.name} <span style="font-weight:400;color:#888;">${i.weight || ''}${i.unit || 'g'}</span></span>`;
    }).join('');

    mealsHtml += `
      <div style="margin-bottom:14px;background:white;border-radius:14px;border:2px solid #F0EDE0;padding:12px 14px;">
        <div style="font-size:13px;font-weight:800;color:#1A1A1A;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
          <span style="font-size:20px;">${icon}</span>
          <span>${slotName}</span>
          ${meal.mealName ? `<span style="font-size:11px;font-weight:500;color:#888;margin-left:4px;">${meal.mealName}</span>` : ''}
        </div>
        <div style="line-height:1.8;">${ingLines || '<span style="color:#aaa;font-size:13px;">暂无记录</span>'}</div>
        ${meal.notes ? `<div style="margin-top:6px;font-size:11px;color:#888;font-style:italic;">备注：${meal.notes}</div>` : ''}
      </div>
    `;
  }

  // total stats
  const totals = {};
  dayMeals.forEach(m => {
    (m.ingredients || []).forEach(i => {
      totals[i.name] = (totals[i.name] || 0) + (i.weight || 0);
    });
  });
  const totalGrams = Object.values(totals).reduce((s, v) => s + v, 0);
  const totalIngCount = Object.keys(totals).length;

  wrap.innerHTML = `
    <!-- Header -->
    <div style="background:#E31837;padding:20px 20px 16px;color:white;text-align:center;">
      <div style="font-size:28px;margin-bottom:4px;">🥣</div>
      <div style="font-size:18px;font-weight:800;letter-spacing:0.5px;">辣堡今日辅食</div>
      <div style="font-size:12px;margin-top:4px;opacity:0.85;">${dateLabel}</div>
      ${ageLabel ? `<div style="font-size:11px;margin-top:2px;opacity:0.75;">${ageLabel}</div>` : ''}
    </div>

    <!-- Meals -->
    <div style="padding:16px 16px 8px;">
      ${mealsHtml}
    </div>

    <!-- Summary bar -->
    <div style="margin:0 16px 16px;background:#F9F6ED;border-radius:12px;padding:10px 16px;display:flex;justify-content:space-around;border:2px solid #E8E3CE;">
      <div style="text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#E31837;">${dayMeals.length}</div>
        <div style="font-size:10px;color:#888;margin-top:2px;">顿辅食</div>
      </div>
      <div style="width:1.5px;background:#E8E3CE;"></div>
      <div style="text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#E31837;">${totalIngCount}</div>
        <div style="font-size:10px;color:#888;margin-top:2px;">种食材</div>
      </div>
      <div style="width:1.5px;background:#E8E3CE;"></div>
      <div style="text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#E31837;">${totalGrams}</div>
        <div style="font-size:10px;color:#888;margin-top:2px;">克总量</div>
      </div>
    </div>

    <!-- Footer watermark -->
    <div style="text-align:center;padding:0 16px 14px;font-size:10px;color:#bbb;">
      辣堡的辅食日记 · 用❤️记录每一口
    </div>
  `;

  document.body.appendChild(wrap);

  try {
    if (typeof html2canvas !== 'function') {
      alert('导出功能加载中，请稍后再试');
      return;
    }
    const canvas = await html2canvas(wrap, {
      backgroundColor: '#FFFDF7',
      scale: 2.5,
      useCORS: true,
      logging: false,
      width: 360,
    });

    // Try Web Share API first (mobile)
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], 'menu.png', { type: 'image/png' })] })) {
      const file = new File([blob], `辣堡辅食_${dateStr}.png`, { type: 'image/png' });
      await navigator.share({
        title: `辣堡今日辅食 · ${dateLabel}`,
        files: [file],
      });
    } else {
      // Fallback: download
      const link = document.createElement('a');
      link.download = `辣堡辅食_${dateStr}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('已保存图片，可转发到微信 ✓');
    }
  } catch (err) {
    console.error('Share card failed:', err);
    showToast('保存失败，请重试');
  } finally {
    wrap.remove();
    if (btn) { btn.textContent = '📤 分享食谱'; btn.disabled = false; }
  }
}

// ===== Toast =====
function showToast(msg) {
  let toast = document.getElementById('copyToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'copyToast';
    toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--black);color:white;padding:10px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;z-index:9999;pointer-events:none;transition:opacity 0.3s,transform 0.3s;opacity:0;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-10px)';
  }, 1800);
}

// ===== Keyboard shortcuts + Copy/Paste =====
document.addEventListener('keydown', (e) => {
  // Don't intercept in inputs
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.activeElement.isContentEditable;

  // Ctrl+C: Copy selected date's meals
  if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C' || e.code === 'KeyC') && !inInput) {
    if (!selectedDate) return;
    const dayMeals = allMeals.filter(m => m.date === selectedDate);
    if (dayMeals.length === 0) {
      showToast('当天无辅食记录');
      e.preventDefault();
      return;
    }
    const copyData = {
      type: 'baby-food-meals',
      date: selectedDate,
      meals: dayMeals.sort((a,b) => a.mealNumber - b.mealNumber).map(m => ({
        mealNumber: m.mealNumber,
        mealName: m.mealName || '',
        ingredients: m.ingredients || [],
        notes: m.notes || '',
      }))
    };
    const jsonStr = JSON.stringify(copyData);

    // Try modern clipboard API first, fall back to execCommand
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(jsonStr).then(() => {
          showToast(`已复制 ${dayMeals.length} 顿辅食 ✓`);
        }).catch((err) => {
          console.error('Clipboard write failed:', err);
          fallbackCopy(jsonStr, dayMeals.length);
        });
      } else {
        fallbackCopy(jsonStr, dayMeals.length);
      }
    } catch (err) {
      console.error('Clipboard error:', err);
      fallbackCopy(jsonStr, dayMeals.length);
    }
    e.preventDefault();
    return;
  }

  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft' && !document.querySelector('.modal-overlay')) prevMonth();
  if (e.key === 'ArrowRight' && !document.querySelector('.modal-overlay')) nextMonth();
});

// Fallback copy using execCommand
function fallbackCopy(text, count) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) {
      showToast(`已复制 ${count} 顿辅食 ✓`);
    } else {
      showToast('复制失败，请重试');
    }
  } catch (err) {
    console.error('Fallback copy failed:', err);
    showToast('复制失败，请重试');
  }
}

// Ctrl+V (paste event has better clipboard access)
document.addEventListener('paste', (e) => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.activeElement.isContentEditable;
  if (inInput) return;

  if (!e.clipboardData) return;
  const text = e.clipboardData.getData('text');
  if (!text) return;

  try {
    const data = JSON.parse(text);
    if (data.type !== 'baby-food-meals' || !Array.isArray(data.meals) || !data.meals.length) return;

    e.preventDefault();
    e.stopPropagation();
    pasteMealsToDate(data);
  } catch (err) {
    // Not our clipboard data, ignore
  }
});

async function pasteMealsToDate(data) {
  try {
    // Use currently selected date
    const targetDate = selectedDate;
    if (!targetDate) {
      showToast('请先在日历中选择一个目标日期');
      return;
    }

    // Validate data
    if (!data.meals || !data.meals.length) {
      showToast('剪贴板中没有有效的辅食数据');
      return;
    }

    // Clear existing meals for target date
    const existing = allMeals.filter(m => m.date === targetDate);
    for (const m of existing) {
      await dbDelete('meals', m.id);
    }

    // Insert copied meals
    let count = 0;
    for (const m of data.meals) {
      await dbPut('meals', {
        date: targetDate,
        mealNumber: m.mealNumber,
        mealName: m.mealName || '',
        ingredients: m.ingredients || [],
        notes: m.notes || '',
        createdAt: new Date().toISOString()
      });
      count++;
    }

    await loadAllData();
    renderCalendar();
    renderDailyStats();

    // If day modal is open, refresh it
    if (document.querySelector('.modal-overlay') && document.getElementById('dayRecipeSearch')) {
      openDayModal(targetDate);
    }

    showToast(`已粘贴 ${count} 顿辅食 → ${targetDate} ✓`);
  } catch (err) {
    console.error('粘贴失败:', err);
    showToast('粘贴失败，请重试');
  }
}

// Click-outside handler for day recipe search
document.addEventListener('click', function(e) {
  // Day recipe search results
  const drr = document.getElementById('dayRecipeResults');
  const drs = document.getElementById('dayRecipeSearch');
  if (drr && drr.style.display !== 'none' && drs && !drs.contains(e.target) && !drr.contains(e.target)) {
    drr.style.display = 'none';
  }
});
